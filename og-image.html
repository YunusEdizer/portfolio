<!doctype html><html lang="tr"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:"Segoe UI Variable Display","Segoe UI",-apple-system,Helvetica,Arial,sans-serif;background:#fff;color:#1d1d1f;position:relative}
  .wrap{position:absolute;inset:0;padding:64px 84px 56px;display:flex;flex-direction:column;justify-content:space-between}
  .kicker{font-size:24px;font-weight:600;color:#6e6e73;letter-spacing:-.01em}
  h1{margin:10px 0 0;font-size:100px;line-height:.98;font-weight:700;letter-spacing:-.045em}
  .sub{margin-top:20px;font-size:26px;color:#6e6e73;letter-spacing:-.01em;max-width:680px;line-height:1.3}
  .foot{display:flex;flex-direction:column;gap:26px;align-items:flex-start}
  .name{font-size:30px;font-weight:600;letter-spacing:-.02em}
  .url{font-size:24px;color:#0066cc}
  .stats{display:flex;gap:48px;margin-top:24px}
  .stats div{display:flex;flex-direction:column}
  .stats b{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1}
  .stats span{font-size:17px;color:#6e6e73;margin-top:6px}
  .phone{position:absolute;right:84px;top:80px;width:240px;height:600px;border-radius:38px;background:#1d1d1f;padding:9px;box-shadow:0 30px 70px rgba(0,0,0,.22), inset 0 0 0 2px #3a3a3c}
  .phone:before{content:"";position:absolute;top:18px;left:50%;width:76px;height:22px;transform:translateX(-50%);background:#000;border-radius:999px}
  .scr{width:100%;height:100%;border-radius:30px;background:#f5f5f7;padding:50px 12px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:9px}
  .s{height:30px;border-radius:10px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .c{display:flex;gap:8px;background:#fff;border-radius:12px;padding:8px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .c i{width:54px;height:46px;border-radius:9px;background:linear-gradient(135deg,#ff9f0a,#ff375f)}
  .c:nth-of-type(3) i{background:linear-gradient(135deg,#30d158,#0a84ff)}
  .c:nth-of-type(4) i{background:linear-gradient(135deg,#bf5af2,#0a84ff)}
  .c:nth-of-type(5) i{background:linear-gradient(135deg,#13788c,#4f9aeb)}
  .c div{flex:1;display:flex;flex-direction:column;justify-content:center;gap:7px}
  .c div:before,.c div:after{content:"";height:8px;border-radius:4px;background:#e8e8ed;width:80%}
  .c div:after{width:45%;background:#d2d2d7}
</style></head><body>
<div class="wrap">
  <div>
    <div class="kicker">Yazılım Mühendisi · İstanbul</div>
    <h1>Fikirden<br>App Store'a.</h1>
    <div class="sub">.NET, Next.js ve React Native ile mağazalarda yayında ürünler. Backend, mobil ve yapay zeka.</div>
  </div>
  <div class="foot">
    <div class="stats">
      <div><b>2</b><span>uygulama mağazada</span></div>
      <div><b>10.000+</b><span>aktif kullanıcı</span></div>
      <div><b>TRL6</b><span>yapay zeka Ar-Ge</span></div>
    </div>
    <div><div class="name">Yunus Emre Edizer</div><div class="url">yunusedizer.software</div></div>
  </div>
</div>
<div class="phone"><div class="scr"><div class="s"></div><div class="c"><i></i><div></div></div><div class="c"><i></i><div></div></div><div class="c"><i></i><div></div></div><div class="c"><i></i><div></div></div></div></div>
</body></html>
