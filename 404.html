<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sayfa bulunamadı · Yunus Emre Edizer</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231d1d1f'/><text x='50' y='66' font-size='44' font-family='-apple-system,Helvetica,Arial,sans-serif' font-weight='700' fill='%23ffffff' text-anchor='middle'>YE</text></svg>" />
  <style>
    :root { --bg: #fff; --text: #1d1d1f; --text-2: #6e6e73; --link: #0066cc; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --text: #f5f5f7; --text-2: #a1a1a6; --link: #2997ff; } }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 32px;
      background: var(--bg); color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    h1 { font-size: clamp(40px, 8vw, 72px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
    p { color: var(--text-2); font-size: 19px; margin: 16px 0 26px; }
    a { color: var(--link); text-decoration: none; font-size: 17px; }
    a::after { content: " \203A"; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Bu sayfa yok.</h1>
    <p>Aradığınız sayfa taşınmış ya da hiç var olmamış olabilir.</p>
    <a href="/">Ana sayfaya dön</a>
  </main>
</body>
</html>
