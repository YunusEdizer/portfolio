<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Sayfa Bulunamadı · Yunus Emre Edizer</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0b0e" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230a0b0e'/><rect x='4' y='4' width='92' height='92' rx='21' fill='none' stroke='%23cbab72' stroke-width='4'/><text x='50' y='67' font-size='46' font-family='monospace' font-weight='bold' fill='%23cbab72' text-anchor='middle'>YE</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0b0e; --text: #ece9e2; --text-dim: #98968e;
      --accent: #cbab72; --border: rgba(236,233,226,0.18);
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      min-height: 100vh; display: grid; place-items: center; text-align: center;
      background: var(--bg); color: var(--text); font-family: var(--font);
      padding: 32px; overflow: hidden; position: relative;
    }
    .orb {
      position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.5;
      pointer-events: none; z-index: 0;
    }
    .orb-1 { width: 460px; height: 460px; top: -120px; left: -100px;
      background: radial-gradient(circle, rgba(203,171,114,0.28), transparent 70%); }
    .orb-2 { width: 520px; height: 520px; bottom: -160px; right: -120px;
      background: radial-gradient(circle, rgba(111,202,143,0.14), transparent 70%); }
    .wrap { position: relative; z-index: 1; max-width: 520px; }
    .code {
      font-family: var(--mono); font-size: clamp(5rem, 22vw, 10rem); font-weight: 700;
      line-height: 1; letter-spacing: -0.04em;
      background: linear-gradient(100deg, #e9d6a6, #cbab72 40%, #f2e6c4 62%, #b8955c);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .eyebrow {
      font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 18px;
    }
    h1 { font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 600; margin: 14px 0 12px; letter-spacing: -0.02em; }
    p { color: var(--text-dim); font-size: 1.02rem; line-height: 1.6; margin-bottom: 34px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 14px 30px;
      border-radius: 100px; background: var(--text); color: var(--bg);
      text-decoration: none; font-weight: 500; font-size: 14.5px;
      transition: transform 0.28s cubic-bezier(0.22,1,0.36,1), box-shadow 0.28s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 42px rgba(236,233,226,0.2); }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="wrap">
    <div class="eyebrow">Hata · 404</div>
    <div class="code">404</div>
    <h1>Bu sayfa kaybolmuş.</h1>
    <p>Aradığın sayfa taşınmış ya da hiç var olmamış olabilir. Ana sayfaya dönüp devam edelim.</p>
    <a href="/" class="btn">← Ana Sayfaya Dön</a>
  </div>
</body>
</html>
